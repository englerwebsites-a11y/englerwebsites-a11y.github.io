<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAICAYAAADED76LAAAAAXNSR0IArs4c6QAAAERlWElmTU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAA6ABAAMAAAABAAEAAKACAAQAAAABAAAACKADAAQAAAABAAAACAAAAACVhHtSAAAAp0lEQVQYGWNkQID/CCaYxQgimaCC/0Ny+xj+///PEJbUD6aB4mANLCAGSJLpKyODoU0Kw4c3r4D0FbAiRkbG/yBjgBr/wyXff/jKICjAzWDi5siwZnIR2AKQCf8V1H3/84s7/Wfl0QbTYF1AzcxAJQ1XT+5gOH7+JcO//78Z2FjYGCRlZBj2H73HcPX8TrAJIAKk4T/QgWAaZCJIDCQB9gqIAQRYvQkAXB5PkvP3l5AAAAAASUVORK5CYII=">
  <title>Engler — Appraisals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F7F8FB;
      --bg-soft: #F0F3F8;
      --tab: #16233B;
      --tab-deep: #0D1729;
      --ink: #16233B;
      --ink-soft: #5F6776;
      --silver: #9BA3B0;
      --silver-line: #DDE2EA;
      --accent: #2F6BFF;
      --accent-soft: #E9F0FF;
      --danger: #D64545;
      --ok: #1F9D6B;
      --shadow-sm: 0 12px 30px rgba(13, 23, 41, 0.06);
      --font-display: 'Archivo', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: linear-gradient(180deg, #FFFFFF 0%, #F8F9FC 100%);
      color: var(--ink);
      line-height: 1.5;
      min-height: 100vh;
    }
    a { color: inherit; }
    [hidden] { display: none !important; }

    header {
      position: sticky; top: 0; z-index: 20;
      background: rgba(22,35,59,0.96);
      backdrop-filter: blur(14px);
      box-shadow: 0 8px 24px rgba(4,10,20,0.16);
    }
    nav {
      max-width: 1240px; margin: 0 auto; padding: 16px 32px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .logo {
      font-family: var(--font-display); font-weight: 800; font-size: 1.15rem;
      letter-spacing: -0.02em; color: #FFF; text-decoration: none;
      display: flex; align-items: center; gap: 10px;
    }
    .logo .mark { width: 33px; height: 33px; border-radius: 8px; image-rendering: pixelated; }
    .logo small { font-family: var(--font-mono); font-weight: 400; font-size: 0.72rem; opacity: 0.6; letter-spacing: 0.08em; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo-sub { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.08em; color: #FFF; opacity: 0.6; text-decoration: none; padding: 4px 6px; margin: -4px -6px; border-radius: 6px; transition: opacity .15s, background .15s; }
    .logo-sub:hover, .logo-sub:focus-visible { opacity: 1; background: rgba(255,255,255,0.08); }
    .logo-sub:focus-visible { outline: 2px solid #7CA6FF; outline-offset: 2px; }
    .nav-right { display: flex; align-items: center; gap: 14px; color: #FFF; font-family: var(--font-mono); font-size: 0.78rem; }
    .nav-right .who { opacity: 0.7; }

    .eyebrow { font-family: var(--font-mono); font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
    h1 { font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; letter-spacing: -0.03em; line-height: 1.15; margin: 8px 0 10px; }
    h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; letter-spacing: -0.02em; }

    .btn {
      font: inherit; font-weight: 600; font-size: 0.92rem; cursor: pointer;
      padding: 12px 20px; border-radius: 999px; border: 1px solid transparent; transition: all 0.15s;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
    }
    .btn-primary { background: var(--tab); color: #FFF; }
    .btn-primary:hover { background: var(--tab-deep); }
    .btn-ghost { background: #FFF; color: var(--ink); border-color: var(--silver-line); }
    .btn-ghost:hover { border-color: var(--silver); }
    .btn-danger { background: #FFF; color: var(--danger); border-color: #F1CFCF; }
    .btn-danger:hover { border-color: var(--danger); }
    .btn-small { padding: 7px 14px; font-size: 0.8rem; }
    .btn:disabled { opacity: 0.6; cursor: wait; }
    header .btn-ghost { background: transparent; color: #FFF; border-color: rgba(255,255,255,0.3); }
    header .btn-ghost:hover { border-color: #FFF; }

    input[type="email"], input[type="password"], input[type="search"] {
      width: 100%; font: inherit; font-size: 0.95rem; color: var(--ink);
      background: var(--bg); border: 1px solid var(--silver-line); border-radius: 10px;
      padding: 11px 14px; transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    input:focus { outline: none; background: #FFF; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

    /* ---- Sign in ---- */
    .login-wrap {
      min-height: calc(100vh - 66px); display: grid; place-items: center; padding: 40px 16px;
      background: radial-gradient(circle at top right, rgba(47,107,255,0.16), transparent 35%);
    }
    .login {
      width: 100%; max-width: 400px; background: #FFF; border: 1px solid var(--silver-line);
      border-radius: 16px; box-shadow: var(--shadow-sm); padding: 32px;
    }
    .login p { color: var(--ink-soft); font-size: 0.9rem; margin-bottom: 22px; }
    .login label { display: block; font-weight: 600; font-size: 0.88rem; margin: 14px 0 6px; }
    .login .btn { width: 100%; margin-top: 22px; }
    .login-error { color: var(--danger); font-size: 0.85rem; margin-top: 12px; min-height: 1.2em; }

    /* ---- Dashboard ---- */
    .dash {
      max-width: 1240px; margin: 0 auto; padding: 28px 32px 80px;
      display: grid; grid-template-columns: 300px 1fr; gap: 32px; align-items: start;
    }
    .list-panel { position: sticky; top: 90px; display: flex; flex-direction: column; gap: 12px; max-height: calc(100vh - 110px); }
    .list-head { display: flex; justify-content: space-between; align-items: baseline; }
    .list-head .count { font-family: var(--font-mono); font-size: 0.75rem; color: var(--silver); }
    .list { overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 4px; }
    .item {
      text-align: left; font: inherit; cursor: pointer; width: 100%;
      background: #FFF; border: 1px solid var(--silver-line); border-radius: 12px; padding: 12px 14px;
      transition: border-color 0.15s, background 0.15s;
    }
    .item:hover { border-color: var(--silver); }
    .item.active { border-color: var(--accent); background: var(--accent-soft); }
    .item .name { font-weight: 600; font-size: 0.95rem; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item .date { font-family: var(--font-mono); font-size: 0.72rem; color: var(--ink-soft); }
    .item .clip { float: right; font-size: 0.75rem; color: var(--silver); }
    .new-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); margin-right: 8px; vertical-align: 1px; }
    .empty { color: var(--ink-soft); font-size: 0.9rem; padding: 24px 4px; }

    .detail { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
    .detail-head {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px;
      padding-bottom: 4px;
    }
    .detail-head .meta { font-family: var(--font-mono); font-size: 0.78rem; color: var(--silver); }
    .detail-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .placeholder {
      border: 1.5px dashed var(--silver-line); border-radius: 16px; padding: 60px 24px;
      text-align: center; color: var(--ink-soft);
    }

    section.card {
      background: #FFF; border: 1px solid var(--silver-line); border-radius: 16px;
      box-shadow: var(--shadow-sm); padding: 32px;
    }
    .card-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--silver-line); }
    .card-head .num { font-family: var(--font-mono); font-size: 0.8rem; color: var(--accent); }
    .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 22px; }
    .field:last-child { margin-bottom: 0; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }
    .q { font-weight: 600; font-size: 0.95rem; }
    .hint { font-size: 0.83rem; color: var(--ink-soft); margin-top: -4px; }
    .answer {
      background: var(--bg); border: 1px solid var(--silver-line); border-radius: 10px;
      padding: 11px 14px; font-size: 0.95rem; white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .answer.none { color: var(--silver); font-style: italic; }
    .sub-label { font-size: 0.8rem; color: var(--ink-soft); margin-top: 2px; }
    .answer a { color: var(--accent); }

    .appraisal { border-color: var(--accent); }
    .ap-row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--silver-line); }
    .ap-label { font-weight: 600; }
    .ap-detail { font-size: 0.83rem; color: var(--ink-soft); }
    .ap-amount { font-family: var(--font-mono); font-size: 1rem; white-space: nowrap; }
    .ap-total { border-bottom: none; padding-bottom: 0; }
    .ap-total .ap-label { font-family: var(--font-display); font-size: 1.15rem; }
    .ap-total .ap-amount { font-size: 1.35rem; font-weight: 500; color: var(--accent); }
    .ap-note { margin-top: 14px; font-size: 0.83rem; color: var(--ink-soft); background: var(--bg); border-radius: 10px; padding: 10px 14px; }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      display: inline-block; padding: 8px 14px; border-radius: 999px;
      border: 1px solid var(--silver-line); background: var(--bg); font-size: 0.88rem; color: var(--silver);
    }
    .chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 500; }

    .notice {
      background: var(--accent-soft); border-left: 3px solid var(--accent);
      border-radius: 10px; padding: 18px 20px; font-size: 0.95rem; margin-bottom: 18px;
    }
    .agree {
      display: flex; gap: 12px; align-items: center;
      padding: 14px 16px; border: 1px solid var(--silver-line); border-radius: 10px; background: var(--bg); font-weight: 500;
    }
    .tick {
      width: 20px; height: 20px; border-radius: 5px; flex-shrink: 0; display: grid; place-items: center;
      border: 1.5px solid var(--silver); color: #FFF; font-size: 0.8rem;
    }
    .tick.on { background: var(--ok); border-color: var(--ok); }

    .contact { border: 1px solid var(--silver-line); border-radius: 12px; padding: 16px 18px; margin-bottom: 10px; background: #FCFDFE; }
    .contact-title { font-family: var(--font-mono); font-size: 0.75rem; color: var(--silver); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.08em; }
    .contact dl { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; }
    .contact dt { font-size: 0.78rem; color: var(--ink-soft); }
    .contact dd { font-size: 0.95rem; overflow-wrap: anywhere; }

    .files { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
    .file {
      border: 1px solid var(--silver-line); border-radius: 12px; overflow: hidden; background: #FFF;
      display: flex; flex-direction: column;
    }
    .file .thumb {
      aspect-ratio: 4 / 3; display: grid; place-items: center; background:
        repeating-conic-gradient(#F0F3F8 0% 25%, #FFF 0% 50%) 50% / 16px 16px;
      color: var(--ink-soft); font-family: var(--font-mono); font-size: 0.8rem;
    }
    .file .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .file .fname { padding: 8px 10px; font-family: var(--font-mono); font-size: 0.72rem; border-top: 1px solid var(--silver-line); overflow-wrap: anywhere; }
    .file .fname a { color: var(--accent); }
    .file.failed .thumb { background: #FDF3F3; color: var(--danger); text-align: center; padding: 10px; white-space: pre-line; }
    .file.in-drive .thumb { background: var(--accent-soft); color: var(--accent); text-align: center; padding: 10px; font-weight: 500; }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(120px);
      background: var(--tab-deep); color: #FFF; padding: 12px 20px; border-radius: 999px;
      font-size: 0.88rem; box-shadow: 0 12px 30px rgba(0,0,0,0.2); transition: transform 0.3s ease; z-index: 50;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    @media (max-width: 900px) {
      .dash { grid-template-columns: 1fr; }
      .list-panel { position: static; max-height: none; }
      .list { max-height: 320px; }
    }
    @media (max-width: 600px) {
      nav, .dash { padding-left: 16px; padding-right: 16px; }
      .nav-right .who { display: none; }
      section.card { padding: 22px 18px; }
      .grid-2, .contact dl { grid-template-columns: 1fr; }
    }

    /* ---- Appraisals ---- */
    .detail-head h1 { margin: 4px 0 2px; }
    .req-row { display: grid; grid-template-columns: 200px 1fr; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--silver-line); }
    .req-row:last-child { border-bottom: none; padding-bottom: 0; }
    .req-row:first-of-type { padding-top: 0; }
    .req-label { font-weight: 600; font-size: 0.9rem; }
    .req-value { font-size: 0.95rem; white-space: pre-wrap; overflow-wrap: anywhere; }
    .req-value.none { color: var(--silver); font-style: italic; }
    .ap-row.discount .ap-amount { color: var(--ok); }
    .money-input { position: relative; }
    .money-input span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-soft); }
    .items-table { width: 100%; border-collapse: collapse; }
    .items-table th { text-align: left; font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); font-weight: 500; padding: 0 8px 8px 0; }
    .items-table td { padding: 5px 8px 5px 0; vertical-align: middle; }
    .items-table th:last-child, .items-table td:last-child { padding-right: 0; width: 1%; }
    .items-table .col-type { width: 130px; }
    .items-table .col-price { width: 130px; }
    .items-table input, .items-table select { width: 100%; font: inherit; font-size: 0.92rem; color: var(--ink); background: var(--bg); border: 1px solid var(--silver-line); border-radius: 10px; padding: 9px 12px; }
    .items-table input:focus, .items-table select:focus { outline: none; background: #FFF; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .items-table .money-input input { padding-left: 24px; }
    .item-remove { font: inherit; font-size: 1.1rem; line-height: 1; width: 34px; height: 34px; border-radius: 8px; border: 1px solid transparent; background: none; color: var(--silver); cursor: pointer; }
    .item-remove:hover { color: var(--danger); border-color: #F1CFCF; }
    .items-empty { color: var(--ink-soft); font-size: 0.9rem; padding: 8px 0 4px; }
    .items-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--silver-line); }
    .items-foot .left, .items-foot .right { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .items-sum { font-family: var(--font-mono); font-size: 0.85rem; color: var(--ink-soft); }
    .items-sum strong { color: var(--ink); font-weight: 500; }
    .unsaved { font-size: 0.8rem; color: #9A6A00; }
    .pay-status { font-size: 0.95rem; margin-bottom: 8px; }
    .pay-status.stale { color: #9A6A00; font-weight: 500; }
    .pay-link { font-family: var(--font-mono); font-size: 0.8rem; color: var(--ink-soft); margin-bottom: 16px; overflow-wrap: anywhere; }
    .pay-link a { color: var(--accent); }
    .fee-note { margin-top: 12px; font-size: 0.82rem; color: var(--ink-soft); }
    .fee-note.local { color: #9A6A00; }
    @media (max-width: 600px) {
      .req-row { grid-template-columns: 1fr; gap: 4px; }
        .items-table thead { display: none; }
      .items-table tr { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--silver-line); }
      .items-table td { padding: 0; }
      .items-table td:first-child { grid-column: 1 / -1; }
      .items-table .col-type, .items-table .col-price { width: auto; }
    }
  </style>
</head>

  <header>
    <nav>
      <div class="brand">
        <a class="logo" href="../home.html"><img class="mark" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAICAYAAADED76LAAAAAXNSR0IArs4c6QAAAERlWElmTU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAA6ABAAMAAAABAAEAAKACAAQAAAABAAAACKADAAQAAAABAAAACAAAAACVhHtSAAAAp0lEQVQYGWNkQID/CCaYxQgimaCC/0Ny+xj+///PEJbUD6aB4mANLCAGSJLpKyODoU0Kw4c3r4D0FbAiRkbG/yBjgBr/wyXff/jKICjAzWDi5siwZnIR2AKQCf8V1H3/84s7/Wfl0QbTYF1AzcxAJQ1XT+5gOH7+JcO//78Z2FjYGCRlZBj2H73HcPX8TrAJIAKk4T/QgWAaZCJIDCQB9gqIAQRYvQkAXB5PkvP3l5AAAAAASUVORK5CYII=" alt="Engler logo">ENGLER</a>
        <a class="logo-sub" href="../portal.html" title="Back to the Team Portal">PORTAL</a>
      </div>
      <div class="nav-right" id="navRight" hidden>
        <span class="who" id="who"></span>
        <button class="btn btn-ghost btn-small" id="signOut">Sign out</button>
      </div>
    </nav>
  </header>

  <!-- Sign in -->
  <div class="login-wrap" id="loginView" hidden>
    <form class="login" id="loginForm">
      <div class="eyebrow">Team only</div>
      <h1>Appraisals</h1>
      <p>Sign in with the Engler admin account to view appraisals and make invoices.</p>
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="username" required />
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required />
      <button class="btn btn-primary" type="submit" id="loginBtn">Sign in</button>
      <div class="login-error" id="loginError"></div>
    </form>
  </div>

  <!-- Dashboard -->
  <div class="dash" id="dashView" hidden>
    <aside class="list-panel">
      <div class="list-head"><h2>Appraisals</h2><span class="count" id="count"></span></div>
      <input type="search" id="search" placeholder="Search order number or company…" />
      <div class="list" id="list"></div>
    </aside>
    <main class="detail" id="detail">
      <div class="placeholder">Select an order form to see its appraisal.</div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="../appraisal.js"></script>
  <script src="../order-number.js"></script>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, setPersistence, browserSessionPersistence, signInWithEmailAndPassword, signOut, onAuthStateChanged }
      from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { getFirestore, collection, query, orderBy, onSnapshot, doc, setDoc, deleteDoc, serverTimestamp }
      from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

    // Must match the config in client-form.html.
    const FIREBASE_CONFIG = {
      apiKey: 'AIzaSyCrmEk6X74MWQH6olX2N5Q5Zd7NJGY_SDk',
      authDomain: 'engler-questionnaire.firebaseapp.com',
      projectId: 'engler-questionnaire',
      storageBucket: 'engler-questionnaire.firebasestorage.app',
      messagingSenderId: '477147439593',
      appId: '1:477147439593:web:43ceb566517778c8fdeb78'
    };
    const SUBMISSIONS_COLLECTION = 'questionnaireSubmissions';
    // One doc per submission: { fees: [{ kind?, amount, reason, addedAt }], items?: [{ type, name, price }], updatedAt }.
    const FEES_COLLECTION = 'questionnaireFees';
    // Public totals for the payment page, keyed by order number: { total, company, publishedAt }.
    // Anyone with an order number can read its doc there, so it holds nothing else.
    const TOTALS_COLLECTION = 'orderTotals';
    // Used when the Firestore rules don't allow the fees collection yet.
    const LOCAL_FEES_KEY = 'engler-appraisal-fees';
    const LOCAL_ITEMS_KEY = 'engler-appraisal-items';

    const BUSINESS = {
      name: 'Engler',
      tagline: 'Websites, drafted & built',
      place: 'Redding, California',
      email: 'EnglerWebsites@gmail.com',
      phone: '(530) 691-2191',
      site: 'englerwebsites.com',
      paymentUrl: 'englerwebsites.com/payment'
    };

    const app = initializeApp(FIREBASE_CONFIG);
    const auth = getAuth(app);
    const db = getFirestore(app);
    setPersistence(auth, browserSessionPersistence);

    const $ = id => document.getElementById(id);
    let submissions = [];
    let fees = {};          // submission ID -> [{ kind?, amount, reason, addedAt }]
    let items = {};         // submission ID -> [{ type: 'page'|'feature', name, price }], once edited
    let feesShared = true;  // false when fees are kept in this browser only
    let selectedId = null;
    let stopWatching = [];
    let published = {};     // order number -> published payment-page doc; null if it can't be read

    // Builds an element; text is always set via textContent because answers are
    // written by the public and must never be interpreted as HTML.
    function el(tag, attrs = {}, ...children) {
      const node = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) {
        if (k === 'class') node.className = v;
        else if (k === 'text') node.textContent = v;
        else node.setAttribute(k, v);
      }
      for (const c of children) if (c != null) node.append(c);
      return node;
    }

    function toast(msg) {
      $('toast').textContent = msg;
      $('toast').classList.add('show');
      clearTimeout(toast.t);
      toast.t = setTimeout(() => $('toast').classList.remove('show'), 2600);
    }

    const money = n => (n < 0 ? '−$' : '$') + Math.abs(Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: Number.isInteger(+n) ? 0 : 2, maximumFractionDigits: 2 });
    const money2 = n => (n < 0 ? '-$' : '$') + Math.abs(Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const appraise = sub => window.Appraisal.appraise(sub.answers);
    const feesFor = id => fees[id] || [];
    const TYPES = { page: 'Page', feature: 'Feature', fee: 'Fee', discount: 'Discount' };
    // Prices are stored as positive numbers; discounts are subtracted.
    const signedPrice = i => (i.type === 'discount' ? -1 : 1) * (Number(i.price) || 0);
    // Fees and discounts added before they became item types; shown in the list until it's next saved.
    const feeAsItem = f => ({ type: f.kind === 'discount' ? 'discount' : 'fee', name: f.reason, price: Number(f.amount) || 0 });

    // The invoice inventory starts from the client's answers (each listed page, each feature)
    // and can be edited and saved, including fees and discounts.
    const cleanName = x => x.replace(/^[\s\-*\d.)]+/, '').trim();
    function defaultItems(sub) {
      const a = sub.answers || {};
      const ap = appraise(sub);
      const listed = (a['Anticipated Pages'] || '').split(/[,;\n•]+/).map(cleanName).filter(Boolean);
      const count = parseInt(a['Estimated Page Count'], 10) || 0;
      const pages = listed.slice();
      for (let n = listed.length + 1; n <= count; n++) pages.push(`Additional page ${n - listed.length}`);
      return [
        ...pages.map(name => ({ type: 'page', name: name.slice(0, 120), price: ap.pricePerPage })),
        ...ap.features.map(name => ({ type: 'feature', name, price: ap.pricePerFeature })),
        ...(ap.other ? [{ type: 'feature', name: ap.other.slice(0, 120), price: 0 }] : [])
      ];
    }
    const itemsFor = sub => items[sub.id] || [...defaultItems(sub), ...feesFor(sub.id).map(feeAsItem)];
    const itemsTotal = list => list.reduce((t, i) => t + signedPrice(i), 0);
    const totalFor = sub => Math.max(0, itemsTotal(itemsFor(sub)));
    const submittedDate = sub => sub.submittedAt?.toDate?.() || null;
    function fmtDate(sub) {
      const d = submittedDate(sub);
      return d ? d.toLocaleDateString(undefined, { dateStyle: 'medium' }) : 'Pending…';
    }
    // One order number per order form; also used as the invoice number.
    const invoiceNumber = sub => window.OrderNumber.orderNumber(sub.id);

    // ---- Storage (fees, discounts and edited items share one doc per submission) ----
    function readLocal(key) {
      try { return JSON.parse(localStorage.getItem(key)) || {}; } catch (e) { return {}; }
    }
    function useLocalFees() {
      feesShared = false;
      fees = readLocal(LOCAL_FEES_KEY);
      items = readLocal(LOCAL_ITEMS_KEY);
    }
    async function saveRecord(id) {
      if (feesShared) {
        try {
          const data = { fees: fees[id] || [], updatedAt: serverTimestamp() };
          if (items[id]) data.items = items[id];
          await setDoc(doc(db, FEES_COLLECTION, id), data);
          return true;
        } catch (e) {
          console.warn('Could not save to Firestore; keeping changes in this browser', e);
          const shared = { fees, items };
          useLocalFees();
          fees = { ...fees, ...shared.fees };
          items = { ...items, ...shared.items };
        }
      }
      try {
        localStorage.setItem(LOCAL_FEES_KEY, JSON.stringify(fees));
        localStorage.setItem(LOCAL_ITEMS_KEY, JSON.stringify(items));
        return true;
      } catch (e) { toast("Couldn't save in this browser."); return false; }
    }
    // Saving the inventory folds any older separately-added fees into it.
    function saveItems(id, list) { fees[id] = []; if (list) items[id] = list; else delete items[id]; return saveRecord(id); }

    // ---- Rendering ----
    function reqRow(label, value) {
      const empty = value == null || value === '';
      return el('div', { class: 'req-row' },
        el('div', { class: 'req-label', text: label }),
        el('div', { class: 'req-value' + (empty ? ' none' : ''), text: empty ? 'Not answered' : value }));
    }

    function apRow(label, detail, amount, extraClass = '', right = null) {
      return el('div', { class: 'ap-row' + extraClass },
        el('div', {}, el('div', { class: 'ap-label', text: label }), detail ? el('div', { class: 'ap-detail', text: detail }) : null),
        right || el('div', { class: 'ap-amount', text: money(amount) }));
    }

    function showSubmission(id) {
      selectedId = id;
      renderList();
      const sub = submissions.find(s => s.id === id);
      const detail = $('detail');
      if (!sub) { detail.replaceChildren(el('div', { class: 'placeholder', text: 'Select an order form to see its appraisal.' })); return; }
      const a = sub.answers || {};
      const ap = appraise(sub);
      const reqItems = itemsFor(sub);
      const ofType = t => reqItems.filter(i => i.type === t);
      const names = list => list.map(i => i.name).join(', ');

      const dlBtn = el('button', { class: 'btn btn-primary btn-small', type: 'button', text: 'Download invoice (PDF)' });
      dlBtn.onclick = () => downloadInvoice(sub, dlBtn);
      const head = el('div', { class: 'detail-head' },
        el('div', {},
          el('div', { class: 'eyebrow', text: 'Appraisal' }),
          el('h1', { text: sub.companyName || 'Untitled' }),
          el('div', { class: 'meta', text: `Order ${invoiceNumber(sub)} · Submitted ${fmtDate(sub)}` })),
        el('div', { class: 'detail-actions' }, dlBtn));

      const requests = el('section', { class: 'card' },
        el('div', { class: 'card-head' }, el('span', { class: 'num', text: '01' }), el('h2', { text: 'What the client asked for' })),
        reqRow('Estimated page count', a['Estimated Page Count'] || ''),
        reqRow('Pages they listed', a['Anticipated Pages'] || ''),
        reqRow('Interactive features', ap.features.length ? ap.features.join(', ') : ''),
        reqRow('Other features described', ap.other));

      const [pages, features, feeItems, discounts] = ['page', 'feature', 'fee', 'discount'].map(ofType);
      const appraisal = el('section', { class: 'card appraisal' },
        el('div', { class: 'card-head' }, el('span', { class: 'num', text: '$' }), el('h2', { text: 'Appraisal' })),
        apRow(`Pages × ${pages.length}`, names(pages) || 'None', itemsTotal(pages)),
        apRow(`Features × ${features.length}`, names(features) || 'None', itemsTotal(features)),
        feeItems.length ? apRow(`Fees × ${feeItems.length}`, names(feeItems), itemsTotal(feeItems), ' fee') : null,
        discounts.length ? apRow(`Discounts × ${discounts.length}`, names(discounts), itemsTotal(discounts), ' discount') : null,
        el('div', { class: 'ap-row ap-total' }, el('div', { class: 'ap-label', text: 'Total' }), el('div', { class: 'ap-amount', text: money(totalFor(sub)) })));
      const unpriced = reqItems.filter(i => !(Number(i.price) > 0));
      if (unpriced.length) appraisal.append(el('div', { class: 'ap-note', text: `No price yet: ${unpriced.map(i => i.name || 'Unnamed item').join(', ')}. Set a price in the invoice inventory.` }));

      detail.replaceChildren(head, requests, itemsEditor(sub), appraisal, paymentCard(sub));
    }

    // ---- Payment page ----
    const round2 = n => Math.round(n * 100) / 100;
    function paymentCard(sub) {
      const code = invoiceNumber(sub);
      const current = round2(totalFor(sub));
      const pub = published && published[code];
      const link = `https://englerwebsites.com/payment?order=${code}`;
      const status = el('p', { class: 'pay-status' });
      const actions = el('div', { class: 'detail-actions' });

      const publish = el('button', { class: 'btn btn-primary btn-small', type: 'button' });
      publish.onclick = async () => {
        publish.disabled = true;
        try {
          await setDoc(doc(db, TOTALS_COLLECTION, code), {
            total: current, company: (sub.companyName || '').slice(0, 200), publishedAt: serverTimestamp()
          });
          toast(`Payment page now shows ${money(current)} for ${code}.`);
        } catch (e) {
          console.error(e);
          toast("Couldn't publish: " + (e.code === 'permission-denied' ? 'the Firebase rules need updating.' : e.code || e.message));
          publish.disabled = false;
        }
      };
      const remove = el('button', { class: 'btn btn-danger btn-small', type: 'button', text: 'Remove from payment page' });
      remove.onclick = async () => {
        if (!confirm(`Remove ${code} from the payment page? Clients entering it will be told the invoice isn't ready.`)) return;
        remove.disabled = true;
        try { await deleteDoc(doc(db, TOTALS_COLLECTION, code)); toast('Removed from the payment page.'); }
        catch (e) { console.error(e); toast("Couldn't remove: " + (e.code || e.message)); remove.disabled = false; }
      };
      const open = el('a', { class: 'btn btn-ghost btn-small', href: link, target: '_blank', rel: 'noopener', text: 'Open payment page ↗' });

      if (published === null) {
        status.textContent = "Can't check the payment page right now. The Firebase rules may need updating.";
      } else if (!pub) {
        status.textContent = `Not on the payment page yet. A client who enters ${code} is told their invoice isn't ready.`;
        publish.textContent = `Publish ${money(current)} to payment page`;
        actions.append(publish);
      } else if (round2(Number(pub.total)) === current) {
        status.textContent = `A client who enters ${code} on the payment page sees ${money(current)}.`;
        actions.append(open, remove);
      } else {
        status.classList.add('stale');
        status.textContent = `The payment page shows ${money(pub.total)}, but the total is now ${money(current)}.`;
        publish.textContent = `Update to ${money(current)}`;
        actions.append(publish, open, remove);
      }
      return el('section', { class: 'card' },
        el('div', { class: 'card-head' }, el('span', { class: 'num', text: '03' }), el('h2', { text: 'Payment page' })),
        status,
        el('p', { class: 'pay-link' }, 'Client link: ', el('a', { href: link, target: '_blank', rel: 'noopener', text: link.replace('https://', '') })),
        actions);
    }

    function itemsEditor(sub) {
      const id = sub.id;
      const tbody = el('tbody');
      const sum = el('span', { class: 'items-sum' });
      const unsaved = el('span', { class: 'unsaved', text: 'Unsaved changes' });
      unsaved.hidden = true;
      const edited = !!items[id];

      const readRows = () => [...tbody.querySelectorAll('tr')].map(tr => ({
        type: tr.querySelector('select').value,
        name: tr.querySelector('.item-name').value.trim().slice(0, 120),
        price: Math.max(0, Math.round((parseFloat(tr.querySelector('.item-price').value) || 0) * 100) / 100)
      }));
      const update = () => {
        const rows = readRows();
        sum.replaceChildren(`${rows.length} item${rows.length === 1 ? '' : 's'} · `, el('strong', { text: money(Math.max(0, itemsTotal(rows))) }));
        tbody.parentNode && (empty.hidden = rows.length > 0);
      };
      const changed = () => { unsaved.hidden = false; update(); };

      function row(it) {
        const name = el('input', { type: 'text', class: 'item-name', maxlength: '120', placeholder: 'Item name', 'aria-label': 'Name', value: it.name || '' });
        const type = el('select', { 'aria-label': 'Type' }, ...Object.entries(TYPES).map(([value, text]) => el('option', { value, text })));
        type.value = TYPES[it.type] ? it.type : 'feature';
        const price = el('input', { type: 'number', class: 'item-price', min: '0', step: '0.01', inputmode: 'decimal', 'aria-label': 'Price', value: String(Number(it.price) || 0) });
        const rm = el('button', { class: 'item-remove', type: 'button', title: 'Remove item', 'aria-label': 'Remove item', text: '×' });
        const tr = el('tr', {},
          el('td', {}, name),
          el('td', { class: 'col-type' }, type),
          el('td', { class: 'col-price' }, el('div', { class: 'money-input' }, el('span', { text: '$' }), price)),
          el('td', {}, rm));
        rm.onclick = () => { tr.remove(); changed(); };
        [name, type, price].forEach(i => i.addEventListener('input', changed));
        return tr;
      }
      itemsFor(sub).forEach(it => tbody.append(row(it)));

      const table = el('table', { class: 'items-table' },
        el('thead', {}, el('tr', {}, el('th', { text: 'Name' }), el('th', { class: 'col-type', text: 'Type' }), el('th', { class: 'col-price', text: 'Price' }), el('th', {}))),
        tbody);
      const empty = el('div', { class: 'items-empty', text: 'No items. Add one below.' });

      const addBtn = el('button', { class: 'btn btn-ghost btn-small', type: 'button', text: '+ Add item' });
      addBtn.onclick = () => {
        const tr = row({ type: 'feature', name: '', price: 0 });
        tbody.append(tr); changed();
        tr.querySelector('.item-name').focus();
      };
      const resetBtn = el('button', { class: 'btn btn-ghost btn-small', type: 'button', text: 'Reset to client’s answers' });
      resetBtn.onclick = async () => {
        if (!confirm('Replace this list with the items from the client’s answers? Your edits will be lost.')) return;
        await saveItems(id, null);
        toast('Items reset to the client’s answers.');
        showSubmission(id);
      };
      const saveBtn = el('button', { class: 'btn btn-primary btn-small', type: 'button', text: 'Save changes' });
      saveBtn.onclick = async () => {
        const rows = readRows();
        if (rows.some(r => !r.name)) { toast('Give every item a name before saving.'); return; }
        if (itemsTotal(rows) < 0) { toast('Discounts can’t be more than the rest of the invoice.'); return; }
        saveBtn.disabled = true;
        if (await saveItems(id, rows)) toast('Items saved.');
        saveBtn.disabled = false;
        showSubmission(id);
      };

      const card = el('section', { class: 'card', id: 'itemsCard' },
        el('div', { class: 'card-head' }, el('span', { class: 'num', text: '02' }), el('h2', { text: 'Invoice Inventory' })),
        table, empty,
        el('div', { class: 'items-foot' },
          el('div', { class: 'left' }, addBtn, edited ? resetBtn : null),
          el('div', { class: 'right' }, unsaved, sum, saveBtn)),
        el('div', { class: 'fee-note' + (feesShared ? '' : ' local'), text: feesShared
          ? 'Changes are saved for the whole team and used for the invoice. Discounts are subtracted from the total.'
          : 'Changes are saved in this browser only, because the Firebase rules don’t allow team-wide saving yet. They are still used for the invoice.' }));
      update();
      return card;
    }

    function renderList() {
      const q = $('search').value.trim().toLowerCase();
      const shown = submissions.filter(s => !q || invoiceNumber(s).toLowerCase().includes(q) || (s.companyName || '').toLowerCase().includes(q));
      $('count').textContent = `${shown.length}${q ? ' of ' + submissions.length : ''}`;
      const list = $('list');
      if (!shown.length) {
        list.replaceChildren(el('div', { class: 'empty', text: submissions.length ? 'No matches.' : 'No order forms yet.' }));
        return;
      }
      list.replaceChildren(...shown.map(s => {
        const its = itemsFor(s);
        const nf = its.filter(i => i.type === 'fee').length, nd = its.filter(i => i.type === 'discount').length;
        const tag = [nf && (nf === 1 ? '+1 fee' : `+${nf} fees`), nd && (nd === 1 ? '−1 discount' : `−${nd} discounts`)].filter(Boolean).join(' · ');
        const btn = el('button', { class: 'item' + (s.id === selectedId ? ' active' : ''), type: 'button' },
          tag ? el('span', { class: 'clip', text: tag }) : null,
          el('span', { class: 'name', text: s.companyName || 'Untitled' }),
          el('span', { class: 'date', text: `${invoiceNumber(s)} · ${fmtDate(s)} · ${money(totalFor(s))}` }));
        btn.onclick = () => showSubmission(s.id);
        return btn;
      }));
    }
    $('search').addEventListener('input', renderList);

    function refresh() {
      renderList();
      if (selectedId) {
        // Don't wipe inventory edits that haven't been saved.
        const card = $('itemsCard');
        const itemsDirty = !!card && !card.querySelector('.unsaved').hidden;
        const typing = itemsDirty || !!document.activeElement?.closest('#itemsCard');
        if (!submissions.some(s => s.id === selectedId)) showSubmission(null);
        else if (!typing) showSubmission(selectedId);
      }
    }

    function startListening() {
      const qry = query(collection(db, SUBMISSIONS_COLLECTION), orderBy('submittedAt', 'desc'));
      stopWatching.push(onSnapshot(qry, snap => {
        submissions = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        refresh();
      }, err => {
        console.error(err);
        const msg = err.code === 'permission-denied'
          ? 'This account is not allowed to view order forms. Check the admin UID in the Firestore rules.'
          : "Couldn't load order forms: " + (err.code || err.message);
        $('list').replaceChildren(el('div', { class: 'empty', text: msg }));
      }));
      stopWatching.push(onSnapshot(collection(db, TOTALS_COLLECTION), snap => {
        published = Object.fromEntries(snap.docs.map(d => [d.id, d.data()]));
        refresh();
      }, err => {
        console.warn('Could not load payment page totals', err);
        published = null;
        refresh();
      }));
      stopWatching.push(onSnapshot(collection(db, FEES_COLLECTION), snap => {
        feesShared = true;
        fees = Object.fromEntries(snap.docs.map(d => [d.id, d.data().fees || []]));
        items = Object.fromEntries(snap.docs.filter(d => Array.isArray(d.data().items)).map(d => [d.id, d.data().items]));
        refresh();
      }, err => {
        console.warn('Team-wide fees unavailable; using this browser\'s', err);
        useLocalFees();
        refresh();
      }));
    }

    // ---- Invoice PDF ----
    let jsPDFReady = null;
    function loadJsPDF() {
      jsPDFReady = jsPDFReady || new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
        s.onload = () => resolve(window.jspdf.jsPDF);
        s.onerror = () => { jsPDFReady = null; reject(new Error('Could not load the PDF maker')); };
        document.head.append(s);
      });
      return jsPDFReady;
    }

    // The PDF's built-in fonts only cover Western characters; swap anything else.
    const WINANSI_EXTRA = '€‚ƒ„…†‡ˆ‰Š‹ŒŽ‘’“”•–—˜™š›œžŸ';
    const pdfText = s => String(s ?? '').replace(/→/g, '->').replace(/[\u0100-\uFFFF]/g, ch => WINANSI_EXTRA.includes(ch) ? ch : '?');

    async function downloadInvoice(sub, btn) {
      btn.disabled = true;
      try {
        const jsPDF = await loadJsPDF();
        const a = sub.answers || {};
        const ap = appraise(sub);
        const contact = (sub.contacts || []).find(c => c && (c.name || c.email)) || {};
        const items = [];
        const all = itemsFor(sub);
        const lines = all.filter(i => i.type !== 'discount')
          .map(i => ({ desc: i.name, sub: i.type === 'fee' ? 'Additional fee' : TYPES[i.type] || 'Feature', qty: 1, rate: Number(i.price) || 0 }));
        const discounts = all.filter(i => i.type === 'discount').map(i => ({ reason: i.name, amount: Number(i.price) || 0 }));
        const subtotal = lines.reduce((t, i) => t + i.qty * i.rate, 0);
        const total = Math.max(0, subtotal - discounts.reduce((t, f) => t + (Number(f.amount) || 0), 0));

        const pdf = new jsPDF({ unit: 'pt', format: 'letter' });
        const W = pdf.internal.pageSize.getWidth(), H = pdf.internal.pageSize.getHeight();
        const M = 54, R = W - M;
        const NAVY = [22, 35, 59], INK = [22, 35, 59], SOFT = [95, 103, 118], LINE = [221, 226, 234], ACCENT = [47, 107, 255];
        const set = (size, style = 'normal', color = INK) => { pdf.setFont('helvetica', style); pdf.setFontSize(size); pdf.setTextColor(...color); };
        const text = (s, x, y, opts) => pdf.text(pdfText(s), x, y, opts);

        // Header band
        pdf.setFillColor(...NAVY); pdf.rect(0, 0, W, 96, 'F');
        set(24, 'bold', [255, 255, 255]); text('ENGLER', M, 54);
        set(9, 'normal', [190, 205, 235]); text(BUSINESS.tagline.toUpperCase(), M, 72);
        set(26, 'bold', [255, 255, 255]); text('INVOICE', R, 58, { align: 'right' });

        // From / invoice details
        let y = 132;
        set(8, 'bold', ACCENT); text('FROM', M, y);
        set(10, 'bold'); text(BUSINESS.name, M, y + 16);
        set(9.5, 'normal', SOFT);
        [BUSINESS.place, BUSINESS.email, BUSINESS.phone, BUSINESS.site].forEach((l, i) => text(l, M, y + 31 + i * 13));

        const issued = new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
        const meta = [['Order number', invoiceNumber(sub)], ['Date issued', issued], ['Questionnaire received', submittedDate(sub) ? submittedDate(sub).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }) : '—'], ['Payment due', 'When your website is complete']];
        meta.forEach(([k, v], i) => {
          set(9, 'normal', SOFT); text(k, R - 150, y + 16 + i * 15, { align: 'right' });
          set(9.5, 'bold'); text(v, R, y + 16 + i * 15, { align: 'right' });
        });

        // Bill to
        y = 228;
        set(8, 'bold', ACCENT); text('BILL TO', M, y);
        set(11, 'bold'); text(sub.companyName || 'Client', M, y + 16);
        set(9.5, 'normal', SOFT);
        const billLines = [contact.name && (contact.name + (contact.role ? ', ' + contact.role : '')), contact.email, contact.phone || a['Phone Number'], ...(a['Physical Address'] ? pdf.splitTextToSize(pdfText(a['Physical Address']), 260) : [])].filter(Boolean);
        billLines.forEach((l, i) => text(l, M, y + 31 + i * 13));
        y += 31 + billLines.length * 13 + 22;

        // Line items
        const cQty = R - 190, cRate = R - 100;
        const tableHead = () => {
          pdf.setFillColor(240, 243, 248); pdf.rect(M, y, R - M, 24, 'F');
          set(8, 'bold', SOFT);
          text('DESCRIPTION', M + 10, y + 15.5); text('QTY', cQty, y + 15.5, { align: 'right' });
          text('RATE', cRate, y + 15.5, { align: 'right' }); text('AMOUNT', R - 10, y + 15.5, { align: 'right' });
          y += 24;
        };
        tableHead();
        lines.forEach(it => {
          const descLines = pdf.splitTextToSize(pdfText(it.desc), cQty - M - 60);
          const subLines = it.sub ? pdf.splitTextToSize(pdfText(it.sub), cQty - M - 60) : [];
          const h = 14 + descLines.length * 13 + subLines.length * 11.5 + 8;
          if (y + h > H - 70) { pdf.addPage(); y = M; tableHead(); }
          set(10, 'bold'); pdf.text(descLines, M + 10, y + 18);
          set(8.5, 'normal', SOFT); if (subLines.length) pdf.text(subLines, M + 10, y + 18 + descLines.length * 13);
          set(10, 'normal'); text(String(it.qty), cQty, y + 18, { align: 'right' }); text(money2(it.rate), cRate, y + 18, { align: 'right' });
          set(10, 'bold'); text(money2(it.qty * it.rate), R - 10, y + 18, { align: 'right' });
          y += h;
          pdf.setDrawColor(...LINE); pdf.setLineWidth(0.75); pdf.line(M, y, R, y);
        });
        if (!lines.length) { set(10, 'normal', SOFT); text('No billable items yet.', M + 10, y + 20); y += 32; }

        // Totals
        if (y + 120 + discounts.length * 16 > H - 60) { pdf.addPage(); y = M; }
        y += 18;
        set(10, 'normal', SOFT); text('Subtotal', cRate, y, { align: 'right' });
        set(10, 'normal'); text(money2(subtotal), R - 10, y, { align: 'right' });
        const GREEN = [31, 157, 107];
        discounts.forEach(f => {
          y += 16;
          const label = pdf.splitTextToSize(pdfText('Discount: ' + f.reason), cRate - (M + 150))[0];
          set(10, 'normal', SOFT); pdf.text(label, cRate, y, { align: 'right' });
          set(10, 'normal', GREEN); text(money2(-(Number(f.amount) || 0)), R - 10, y, { align: 'right' });
        });
        y += 14;
        pdf.setFillColor(...NAVY); pdf.roundedRect(cQty - 60, y, R - (cQty - 60), 34, 6, 6, 'F');
        set(10, 'bold', [255, 255, 255]); text('TOTAL DUE', cQty - 46, y + 21.5);
        set(14, 'bold', [255, 255, 255]); text(money2(total), R - 12, y + 22.5, { align: 'right' });
        y += 64;

        // Notes
        set(8, 'bold', ACCENT); text('HOW TO PAY', M, y);
        set(9.5, 'normal', SOFT);
        const notes = pdf.splitTextToSize(pdfText(`Pay online at ${BUSINESS.paymentUrl} with order code ${invoiceNumber(sub)} once your website is finished. Questions about this invoice? Email ${BUSINESS.email} or text ${BUSINESS.phone}.`), R - M);
        pdf.text(notes, M, y + 16);
        y += 16 + notes.length * 13 + 12;
        set(10, 'bold'); text('Thank you for choosing Engler.', M, y);

        // Footer on every page
        const pages = pdf.getNumberOfPages();
        for (let p = 1; p <= pages; p++) {
          pdf.setPage(p);
          pdf.setDrawColor(...LINE); pdf.line(M, H - 44, R, H - 44);
          set(8, 'normal', SOFT);
          text(`${BUSINESS.name} · ${BUSINESS.site} · ${BUSINESS.email}`, M, H - 28);
          text(`${invoiceNumber(sub)} · Page ${p} of ${pages}`, R, H - 28, { align: 'right' });
        }

        const safe = (sub.companyName || 'client').replace(/[^\w-]+/g, '-').replace(/^-|-$/g, '').slice(0, 40);
        pdf.save(`Engler-Invoice-${invoiceNumber(sub)}-${safe}.pdf`);
      } catch (e) {
        console.error(e);
        toast("Couldn't make the invoice: " + (e.message || e));
      } finally {
        btn.disabled = false;
      }
    }

    // ---- Auth ----
    $('loginForm').addEventListener('submit', async ev => {
      ev.preventDefault();
      $('loginError').textContent = '';
      $('loginBtn').disabled = true;
      try {
        await signInWithEmailAndPassword(auth, $('email').value.trim(), $('password').value);
        $('password').value = '';
      } catch (e) {
        $('loginError').textContent = ['auth/invalid-credential', 'auth/wrong-password', 'auth/user-not-found', 'auth/invalid-email'].includes(e.code)
          ? 'Incorrect email or password.'
          : e.code === 'auth/too-many-requests' ? 'Too many attempts. Try again in a few minutes.' : 'Sign-in failed: ' + e.code;
      } finally {
        $('loginBtn').disabled = false;
      }
    });

    $('signOut').addEventListener('click', () => signOut(auth));

    onAuthStateChanged(auth, user => {
      $('loginView').hidden = !!user;
      $('dashView').hidden = !user;
      $('navRight').hidden = !user;
      stopWatching.forEach(stop => stop());
      stopWatching = [];
      if (user) {
        $('who').textContent = user.email;
        startListening();
      } else {
        submissions = [];
        fees = {};
        items = {};
        selectedId = null;
        $('detail').replaceChildren(el('div', { class: 'placeholder', text: 'Select an order form to see its appraisal.' }));
        $('email').focus();
      }
    });
  </script>
</body>
</html>
